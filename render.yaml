services:
  - type: web
    name: ai-interviewer-client
    runtime: static
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
      - key: VITE_FIREBASE_API_KEY
        sync: false

  - type: web
    name: ai-interviewer-gateway
    runtime: node
    plan: free
    rootDir: server/gateway
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: AUTH_SERVICE_URL
        fromService:
          type: web
          name: ai-interviewer-auth
          property: hostport
      - key: RESUME_SERVICE_URL
        fromService:
          type: web
          name: ai-interviewer-resume
          property: hostport
      - key: INTERVIEW_SERVICE_URL
        fromService:
          type: web
          name: ai-interviewer-interview
          property: hostport
      - key: PRICING_SERVICE_URL
        fromService:
          type: web
          name: ai-interviewer-pricing
          property: hostport
      - key: ROADMAP_SERVICE_URL
        fromService:
          type: web
          name: ai-interviewer-roadmap
          property: hostport
      - key: REDIS_URL
        fromDatabase:
          name: ai-interviewer-redis
          property: connectionString
      - key: CLIENT_ORIGIN
        sync: false

  - type: web
    name: ai-interviewer-auth
    runtime: node
    plan: free
    rootDir: server/services/auth
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
      - key: REDIS_URL
        fromDatabase:
          name: ai-interviewer-redis
          property: connectionString

  - type: web
    name: ai-interviewer-resume
    runtime: node
    plan: free
    rootDir: server/services/resume
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false

  - type: web
    name: ai-interviewer-interview
    runtime: node
    plan: free
    rootDir: server/services/interview
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash

  - type: web
    name: ai-interviewer-pricing
    runtime: node
    plan: free
    rootDir: server/services/pricing
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false

  - type: web
    name: ai-interviewer-roadmap
    runtime: node
    plan: free
    rootDir: server/services/roadmap
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.6-flash

databases:
  - name: ai-interviewer-redis
    plan: free