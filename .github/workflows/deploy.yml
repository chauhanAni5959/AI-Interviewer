name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production services
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOKS: ${{ secrets.RENDER_DEPLOY_HOOKS }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOKS" ]; then
            echo "Render Blueprint auto-deploy is enabled; no deploy hooks configured."
            exit 0
          fi
          while IFS= read -r hook; do
            [ -z "$hook" ] || curl --fail --silent --show-error --request POST "$hook"
          done <<< "$RENDER_DEPLOY_HOOKS"