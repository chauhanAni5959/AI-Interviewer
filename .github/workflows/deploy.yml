name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production services
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deployment
        env:
          RENDER_DEPLOY_HOOKS: ${{ secrets.RENDER_DEPLOY_HOOKS }}
        run: |
          test -n "$RENDER_DEPLOY_HOOKS"
          while IFS= read -r hook; do
            [ -z "$hook" ] || curl --fail --silent --show-error --request POST "$hook"
          done <<< "$RENDER_DEPLOY_HOOKS"